framework: "net10.0"
overview: "Scheduled task that refreshes the metadata of the libraries you choose, with live progress"
description: >
  Adds a scheduled task, "Metadata refresh", to the Library category of the Scheduled Tasks. The
  task refreshes the metadata of the libraries selected in the plugin settings, with the same
  options as the "Refresh metadata" dialog of Jellyfin (scan for new and updated files, search for
  missing metadata, replace all metadata, replace existing images, regenerate trickplay images).
  The task has no trigger by default: add the schedule you want in Dashboard > Scheduled Tasks, or
  run it by hand. The progress is shown in the Scheduled Tasks page and in the plugin settings page,
  which has its own entry in the Dashboard sidebar.
category: "Metadata"
